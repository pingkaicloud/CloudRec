name: CloudRec TKE Image CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [shaotao/cloudsec]
    tags: ['cloudsec-dev-image-*']
permissions:
  contents: read
concurrency:
  group: cloudrec-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'pingkaicloud/CloudRec' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: pingkai-runner-cn-shanghai-clinic
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Docker runtime
        run: |
          docker version
          docker info >/dev/null
          docker buildx version
      - name: Validate scripts
        run: |
          bash -n deploy/tke/entrypoint.sh
          bash -n deploy/tke/smoke.sh
          bash -n deploy/tke/publish.sh
      - name: Verify DEV image tag source
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin shaotao/cloudsec
          [[ "$(git rev-parse origin/shaotao/cloudsec)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF_NAME" == "cloudsec-dev-image-${GITHUB_SHA}" ]]
      - name: Build Linux amd64 image
        run: docker build --platform linux/amd64 -f deploy/tke/Dockerfile -t cloudrec-test:${{ github.sha }} .
      - name: Test database initialization and Web startup
        run: bash deploy/tke/smoke.sh cloudrec-test:${{ github.sha }}
      - name: Publish DEV image and update test ledger
        if: startsWith(github.ref, 'refs/tags/cloudsec-dev-image-')
        env:
          TCR_USERNAME: ${{ secrets.TCR_DEPLOY_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_DEPLOY_PASSWORD }}
          DELIVERY_TOKEN: ${{ secrets.GIT_ACTION_BOT }}
        run: bash deploy/tke/publish.sh
